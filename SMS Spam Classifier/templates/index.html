
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS Spam Classifier</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 550px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            text-align: center;
        }

        .icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        h1 {
            color: #333;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            font-size: 15px;
            margin-bottom: 30px;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            resize: none;
            outline: none;
            transition: 0.3s;
        }

        textarea:focus {
            border-color: #764ba2;
            box-shadow: 0 0 8px rgba(118,75,162,0.2);
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 15px rgba(102,126,234,0.4);
        }

        .result {
            margin-top: 25px;
            padding: 18px;
            border-radius: 12px;
            font-size: 19px;
            font-weight: bold;
        }

        .spam {
            background: #ffe5e5;
            color: #d63031;
        }

        .ham {
            background: #e0f7e9;
            color: #218c53;
        }

        .footer {
            margin-top: 25px;
            color: #999;
            font-size: 12px;
        }

        @media (max-width: 500px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">📩</div>

        <h1>SMS Spam Classifier</h1>

        <p class="subtitle">
            Detect spam messages using Machine Learning
        </p>

        <form action="/predict" method="POST">

            <textarea
                name="message"
                placeholder="Enter your SMS message here..."
                required></textarea>

            <button type="submit">Check Message →</button>

        </form>

        {% if prediction %}

            {% if prediction == "Spam" %}
                <div class="result spam">
                    ⚠️ This message is SPAM!
                </div>
            {% else %}
                <div class="result ham">
                    ✅ This message is NOT SPAM!
                </div>
            {% endif %}

        {% endif %}

        <p class="footer">
            Powered by TF-IDF and Multinomial Naive Bayes
        </p>

    </div>

</body>
</html>
